name: Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 85b914dcdebf6fa2fce7b819bc542294
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Build public site
        working-directory: .
        run: |
          npm ci
          npm run check
          npm run modelos
          npm run build
          node --test tests/*.test.mjs
      - name: Check out text publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: avilaops/motor-web
          ref: 02fe995339970e77ba86505488451f8c67bdddc7
          path: .publicacao-texto
          persist-credentials: false
      - name: Install text publisher
        working-directory: .publicacao-texto
        run: npm ci --ignore-scripts --omit=dev
      - name: Generate public MDX and Markdown
        run: node .publicacao-texto/bin/publicar-texto.mjs --diretorio dist --origem https://ludusequipamentos.com
      - name: Publish Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if npx --yes --package=wrangler@4.161.0 wrangler pages deploy dist --project-name=ludusequipamentos --branch=main --commit-hash=${{ github.sha }}; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 15))"; fi
          done
          exit 1
