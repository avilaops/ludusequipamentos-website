name: Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 85b914dcdebf6fa2fce7b819bc542294
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Build public site
        working-directory: .
        run: |
          npm ci
          npm run check
          npm run modelos
          npm run build
          node --test tests/*.test.mjs
      - name: Publish Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes --package=wrangler@4.161.0 wrangler pages deploy dist --project-name=ludusequipamentos --branch=main --commit-hash=${{ github.sha }}
